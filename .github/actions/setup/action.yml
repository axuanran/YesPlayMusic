name: Setup build environment
description: Prepare Node, Yarn, native dependencies, and package install for release builds.

inputs:
  install-package-deps:
    description: Install OS package dependencies required by electron-builder packaging.
    default: 'true'
  install-native-deps:
    description: Install cross-platform optional native packages required by release artifacts.
    default: 'true'
  verify-rollup:
    description: Verify Rollup can be resolved after install.
    default: 'true'

runs:
  using: composite
  steps:
    - name: Install Node.js, NPM and Yarn
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: yarn

    - name: Enable pinned Yarn
      shell: bash
      run: |
        corepack enable
        corepack prepare yarn@1.22.22 --activate

    - name: Install Linux system deps
      if: runner.os == 'Linux' && inputs.install-package-deps == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y rpm libarchive-tools libopenjp2-tools

    - name: Install Snapcraft
      if: runner.os == 'Linux' && inputs.install-package-deps == 'true'
      uses: samuelmeuli/action-snapcraft@v3

    - name: Clean broken install state
      shell: bash
      run: |
        rm -rf node_modules
        rm -f package-lock.json

    - name: Install deps and get UNM version
      id: get_unm_version
      shell: bash
      run: |
        yarn install --frozen-lockfile --ignore-engines --non-interactive --ignore-scripts
        unm_version=$(node -e "console.log(require('./node_modules/@unblockneteasemusic/rust-napi/package.json').version)")
        echo "unmver=${unm_version}" >> "$GITHUB_OUTPUT"

    - name: Install UNM native deps for Windows
      if: runner.os == 'Windows' && inputs.install-native-deps == 'true'
      shell: bash
      run: |
        yarn add --ignore-platform --ignore-engines --non-interactive --no-lockfile --exact \
          @unblockneteasemusic/rust-napi-win32-x64-msvc@${{ steps.get_unm_version.outputs.unmver }}

    - name: Install UNM native deps for Linux
      if: runner.os == 'Linux' && inputs.install-native-deps == 'true'
      shell: bash
      run: |
        yarn add --ignore-platform --ignore-engines --non-interactive --no-lockfile --exact \
          @unblockneteasemusic/rust-napi-linux-x64-gnu@${{ steps.get_unm_version.outputs.unmver }} \
          @unblockneteasemusic/rust-napi-linux-arm64-gnu@${{ steps.get_unm_version.outputs.unmver }}

    - name: Install UNM native deps for macOS
      if: runner.os == 'macOS' && inputs.install-native-deps == 'true'
      shell: bash
      run: |
        yarn add --ignore-platform --ignore-engines --non-interactive --no-lockfile --exact \
          @unblockneteasemusic/rust-napi-darwin-x64@${{ steps.get_unm_version.outputs.unmver }} \
          @unblockneteasemusic/rust-napi-darwin-arm64@${{ steps.get_unm_version.outputs.unmver }} \
          @esbuild/darwin-x64

    - name: Verify Rollup
      if: inputs.verify-rollup == 'true'
      shell: bash
      run: |
        node -e "require('rollup'); console.log('rollup ok')"
