name: Private Download Build

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      compression:
        description: Installer compression
        required: true
        default: normal
        type: choice
        options:
          - normal
          - store

concurrency:
  group: private-download-build-${{ github.ref }}
  cancel-in-progress: true

env:
  YARN_INSTALL_NOPT: yarn add --ignore-platform --ignore-engines --non-interactive --no-lockfile --exact

jobs:
  build-and-upload:
    name: Build private Windows installer and upload to R2
    runs-on: windows-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate R2 configuration
        shell: bash
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          test -n "$R2_ACCOUNT_ID" || { echo "Missing repository variable: R2_ACCOUNT_ID" >&2; exit 1; }
          test -n "$R2_BUCKET_NAME" || { echo "Missing repository variable: R2_BUCKET_NAME" >&2; exit 1; }
          test -n "$R2_ACCESS_KEY_ID" || { echo "Missing repository secret: R2_ACCESS_KEY_ID" >&2; exit 1; }
          test -n "$R2_SECRET_ACCESS_KEY" || { echo "Missing repository secret: R2_SECRET_ACCESS_KEY" >&2; exit 1; }

      - name: Cache electron-builder
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-private-win-${{ hashFiles('yarn.lock') }}

      - name: Install Node.js and Yarn
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Enable pinned Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          yarn install --frozen-lockfile --ignore-engines --non-interactive --ignore-scripts
          unm_version=$(node -e "console.log(require('./node_modules/@unblockneteasemusic/rust-napi/package.json').version)")
          echo "UNM_VERSION=${unm_version}" >> "$GITHUB_ENV"

      - name: Install Windows native audio resolver
        shell: bash
        run: |
          ${{ env.YARN_INSTALL_NOPT }} \
            @unblockneteasemusic/rust-napi-win32-x64-msvc@${UNM_VERSION}

      - name: Build Electron app with download enabled
        run: yarn electron-vite build && yarn tui:build && yarn tui:exe
        env:
          VUE_APP_ENABLE_DOWNLOAD: 'true'
          VUE_APP_NETEASE_API_URL: /api
          VUE_APP_ELECTRON_API_URL: /api
          VUE_APP_ELECTRON_API_URL_DEV: ${{ vars.VUE_APP_ELECTRON_API_URL_DEV || 'http://127.0.0.1:10754' }}
          VUE_APP_LASTFM_API_KEY: ${{ vars.VUE_APP_LASTFM_API_KEY }}
          VUE_APP_LASTFM_API_SHARED_SECRET: ${{ secrets.VUE_APP_LASTFM_API_SHARED_SECRET }}

      - name: Package private NSIS installer
        shell: bash
        run: |
          npx electron-builder --win nsis --x64 --publish never \
            --config.compression="${{ inputs.compression }}"
        env:
          GH_TOKEN: ${{ github.token }}
          EP_PRELEASE: true

      - name: Upload private installer to R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
        run: |
          set -euo pipefail

          installer=$(find dist_electron -maxdepth 1 -type f -name "*.exe" -print -quit)
          test -n "$installer" || {
            echo "NSIS installer was not found" >&2
            exit 1
          }

          branch="${GITHUB_REF_NAME//\//-}"
          destination="s3://${R2_BUCKET_NAME}/private-download/${branch}/run-${GITHUB_RUN_NUMBER}/$(basename "$installer")"
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          aws --version
          aws s3 cp "$installer" "$destination" \
            --endpoint-url "$endpoint" \
            --no-progress
          echo "Uploaded to: $destination"
