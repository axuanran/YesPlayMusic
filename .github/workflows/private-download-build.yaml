name: Private Download Build

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      compression:
        description: Installer compression
        required: true
        default: normal
        type: choice
        options:
          - normal
          - store
  workflow_call:
    inputs:
      compression:
        description: Installer compression
        required: false
        default: normal
        type: string
      checkout_ref:
        description: Git ref to build
        required: false
        default: ''
        type: string

concurrency:
  group: private-download-build-${{ github.ref }}
  cancel-in-progress: true

env:
  YARN_INSTALL_NOPT: yarn add --ignore-platform --ignore-engines --non-interactive --no-lockfile --exact

jobs:
  build-and-upload:
    name: Build private Windows installer and upload to R2
    runs-on: windows-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
          submodules: recursive

      - name: Validate R2 and Telegram configuration
        shell: bash
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          test -n "$R2_ACCOUNT_ID" || { echo "Missing repository variable: R2_ACCOUNT_ID" >&2; exit 1; }
          test -n "$R2_BUCKET_NAME" || { echo "Missing repository variable: R2_BUCKET_NAME" >&2; exit 1; }
          test -n "$R2_ACCESS_KEY_ID" || { echo "Missing repository secret: R2_ACCESS_KEY_ID" >&2; exit 1; }
          test -n "$R2_SECRET_ACCESS_KEY" || { echo "Missing repository secret: R2_SECRET_ACCESS_KEY" >&2; exit 1; }
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "Missing repository secret: TELEGRAM_BOT_TOKEN" >&2; exit 1; }
          test -n "$TELEGRAM_CHAT_ID" || { echo "Missing repository secret: TELEGRAM_CHAT_ID" >&2; exit 1; }

      - name: Cache electron-builder
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-private-win-${{ hashFiles('yarn.lock') }}

      - name: Install Node.js and Yarn
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Enable pinned Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          yarn install --frozen-lockfile --ignore-engines --non-interactive --ignore-scripts
          unm_version=$(node -e "console.log(require('./node_modules/@unblockneteasemusic/rust-napi/package.json').version)")
          echo "UNM_VERSION=${unm_version}" >> "$GITHUB_ENV"

      - name: Install Windows native audio resolver
        shell: bash
        run: |
          ${{ env.YARN_INSTALL_NOPT }} \
            @unblockneteasemusic/rust-napi-win32-x64-msvc@${UNM_VERSION}

      - name: Build Electron app with download enabled
        run: yarn electron-vite build && yarn tui:build && yarn tui:exe
        env:
          VUE_APP_ENABLE_DOWNLOAD: 'true'
          VUE_APP_NETEASE_API_URL: /api
          VUE_APP_ELECTRON_API_URL: /api
          VUE_APP_ELECTRON_API_URL_DEV: ${{ vars.VUE_APP_ELECTRON_API_URL_DEV || 'http://127.0.0.1:10754' }}
          VUE_APP_LASTFM_API_KEY: ${{ vars.VUE_APP_LASTFM_API_KEY }}
          VUE_APP_LASTFM_API_SHARED_SECRET: ${{ secrets.VUE_APP_LASTFM_API_SHARED_SECRET }}

      - name: Package private NSIS installer
        shell: bash
        run: |
          npx electron-builder --win nsis --x64 --publish never \
            --config.compression="${{ inputs.compression }}"
        env:
          GH_TOKEN: ${{ github.token }}
          EP_PRELEASE: true

      - name: Upload private installer to R2
        id: upload_r2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          R2_PUBLIC_BASE_URL: https://ypmdl.repo.oxiilo.com
        run: |
          set -euo pipefail

          installer=$(find dist_electron -maxdepth 1 -type f -name "*.exe" -print -quit)
          test -n "$installer" || {
            echo "NSIS installer was not found" >&2
            exit 1
          }

          source_ref="${{ inputs.checkout_ref || github.ref_name }}"
          source_ref="${source_ref//\//-}"
          object_key="private-download/${source_ref}/run-${GITHUB_RUN_NUMBER}/$(basename "$installer")"
          destination="s3://${R2_BUCKET_NAME}/${object_key}"
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          aws --version
          aws s3 cp "$installer" "$destination" \
            --endpoint-url "$endpoint" \
            --no-progress
          echo "Uploaded to: $destination"

          public_url=$(OBJECT_KEY="$object_key" python -c \
            'import os; from urllib.parse import quote; print("{}/{}".format(os.environ["R2_PUBLIC_BASE_URL"].rstrip("/"), quote(os.environ["OBJECT_KEY"], safe="/")))')
          echo "public_url=${public_url}" >> "$GITHUB_OUTPUT"

      - name: Send R2 public link to Telegram
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUBLIC_URL: ${{ steps.upload_r2.outputs.public_url }}
        run: |
          set -euo pipefail
          message="YesPlayMusic 私有下载版已上传至 R2"$'\n'"${PUBLIC_URL}"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text=${message}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            >/dev/null
