name: Android

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_call:
    inputs:
      publish-artifact:
        description: Upload the versioned APK for the caller's release job
        required: false
        default: false
        type: boolean
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/android.yaml'
      - 'android/**'
      - 'assets/**'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'yarn.lock'
      - 'vite.config.mjs'
      - 'capacitor.config.json'
      - 'index.html'
  workflow_dispatch:

jobs:
  build:
    name: test, lint and build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node and dependencies
        uses: ./.github/actions/setup
        with:
          install-package-deps: 'false'
          install-native-deps: 'false'
          verify-rollup: 'true'

      - name: Resolve Android release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version_input="${GITHUB_REF_NAME}"
          else
            version_input="$(node -p "require('./package.json').releaseVersion || require('./package.json').version")"
          fi

          node scripts/prepare-release-version.mjs \
            "$version_input" \
            --github-output

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        shell: bash
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Validate Android release signing secrets
        if: inputs.publish-artifact
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing repository secret: ${name}" >&2
              exit 1
            fi
          done

      - name: Restore Android release keystore
        if: inputs.publish-artifact
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          keystore_path="${RUNNER_TEMP}/xump-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          keytool -list \
            -keystore "$keystore_path" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Build and sync mobile UI
        run: yarn mobile:sync

      - name: Test, lint and build debug APK
        if: ${{ !inputs.publish-artifact }}
        working-directory: android
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
          RELEASE_VERSION_CODE: ${{ github.run_number }}
        run: |
          ./gradlew testDebugUnitTest lintDebug assembleDebug \
            "-PreleaseVersionName=${RELEASE_VERSION}" \
            "-PreleaseVersionCode=${RELEASE_VERSION_CODE}" \
            --stacktrace \
            --no-daemon

      - name: Test, lint and build signed release APK
        if: inputs.publish-artifact
        working-directory: android
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
          RELEASE_VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew testDebugUnitTest lintDebug assembleRelease \
            "-PreleaseVersionName=${RELEASE_VERSION}" \
            "-PreleaseVersionCode=${RELEASE_VERSION_CODE}" \
            --stacktrace \
            --no-daemon

      - name: Verify signed release APK
        if: inputs.publish-artifact
        shell: bash
        run: |
          set -euo pipefail
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            android/app/build/outputs/apk/release/app-release.apk

      - name: Upload Android reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-build-reports
          path: |
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/reports/lint-results-debug.html
            android/app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore

      - name: Collect versioned Android APK
        if: inputs.publish-artifact
        shell: bash
        env:
          ANDROID_ASSET: ${{ steps.version.outputs.android_asset }}
        run: |
          set -euo pipefail
          mkdir -p release_android
          install -m 644 \
            android/app/build/outputs/apk/release/app-release.apk \
            "release_android/${ANDROID_ASSET}"
          test -f "release_android/${ANDROID_ASSET}"

      - name: Upload Android release artifact
        if: inputs.publish-artifact
        uses: actions/upload-artifact@v4
        with:
          name: XuMP-android
          path: release_android/*
          if-no-files-found: error

      - name: Remove Android release keystore
        if: always() && inputs.publish-artifact
        shell: bash
        run: rm -f "${RUNNER_TEMP}/xump-release.jks"
