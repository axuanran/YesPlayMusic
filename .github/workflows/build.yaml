name: Release

env:
  YARN_INSTALL_NOPT: yarn add --ignore-platform --ignore-engines --non-interactive --no-lockfile --exact
  KEEP_RELEASES: 5

permissions:
  contents: write

on:
  push:
    branches:
      - dev
    tags:
      - v*
  workflow_dispatch:
    inputs:
      release_mode:
        description: Release mode for manual runs
        required: true
        default: prerelease
        type: choice
        options:
          - draft
          - prerelease
          - release

jobs:
  release:
    runs-on: ${{ matrix.os }}
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.snapcraft_token }}

    strategy:
      matrix:
        os: [windows-latest, ubuntu-22.04]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pinned Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install RPM & Pacman (on Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y rpm libarchive-tools libopenjp2-tools

      - name: Install Snapcraft (on Ubuntu)
        uses: samuelmeuli/action-snapcraft@v3
        if: runner.os == 'Linux'

      - name: Clean broken install state
        run: |
          rm -rf node_modules
          rm -f package-lock.json
        shell: bash

      - id: get_unm_version
        name: Get the installed UNM version
        run: |
          yarn install --frozen-lockfile --ignore-engines --non-interactive --ignore-scripts
          unm_version=$(node -e "console.log(require('./node_modules/@unblockneteasemusic/rust-napi/package.json').version)")
          echo "unmver=${unm_version}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Install UNM dependencies for Windows
        if: runner.os == 'Windows'
        run: |
          ${{ env.YARN_INSTALL_NOPT }} \
            @unblockneteasemusic/rust-napi-win32-x64-msvc@${{steps.get_unm_version.outputs.unmver}}
        shell: bash

      - name: Install UNM dependencies for Linux
        if: runner.os == 'Linux'
        run: |
          ${{ env.YARN_INSTALL_NOPT }} \
            @unblockneteasemusic/rust-napi-linux-x64-gnu@${{steps.get_unm_version.outputs.unmver}} \
            @unblockneteasemusic/rust-napi-linux-arm64-gnu@${{steps.get_unm_version.outputs.unmver}}
        shell: bash

      - name: Verify Rollup
        run: |
          node -e "
            const plat = process.platform + '-' + process.arch;
            console.log('node', process.version, plat);
            const map = {
              'linux-x64': '@rollup/rollup-linux-x64-gnu',
              'win32-x64': '@rollup/rollup-win32-x64-msvc',
            };
            const pkg = map[plat];
            if (pkg) console.log(require.resolve(pkg + '/package.json'));
            else console.log('no native rollup check for ' + plat);
          "
          node -e "require('rollup'); console.log('rollup ok')"
        shell: bash

      - name: Build Electron app (electron-vite)
        run: yarn electron-vite build
        env:
          VUE_APP_NETEASE_API_URL: /api
          VUE_APP_ELECTRON_API_URL: /api
          VUE_APP_ELECTRON_API_URL_DEV: ${{ vars.VUE_APP_ELECTRON_API_URL_DEV || 'http://127.0.0.1:10754' }}
          VUE_APP_LASTFM_API_KEY: ${{ vars.VUE_APP_LASTFM_API_KEY }}
          VUE_APP_LASTFM_API_SHARED_SECRET: ${{ secrets.VUE_APP_LASTFM_API_SHARED_SECRET }}

      - name: Package / release Electron app
        run: npx electron-builder
        env:
          GH_TOKEN: ${{ github.token }}
          EP_PRELEASE: true

      - name: Decide publish mode
        id: publish_mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mode="${{ inputs.release_mode }}"
          elif [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            mode="prerelease"
          else
            mode="release"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Build release label
        id: release_label
        shell: bash
        run: |
          ts=$(date -u +'%Y%m%d-%H%M')
          branch="${GITHUB_REF_NAME//\//-}"
          mode="${{ steps.publish_mode.outputs.mode }}"
          label="${mode}-${branch}-${ts}-run${GITHUB_RUN_NUMBER}"
          echo "label=$label" >> "$GITHUB_OUTPUT"

      - name: Capture commit sha
        id: commit_sha
        shell: bash
        run: |
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload Windows prerelease
        if: steps.publish_mode.outputs.mode == 'prerelease' && runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_label.outputs.label }}
          name: prerelease / ${{ github.ref_name }} / ${{ github.run_number }}
          body: |
            Branch: ${{ github.ref_name }}
            Run: ${{ github.run_id }}
            Commit: ${{ steps.commit_sha.outputs.sha }}
            Workflow: ${{ github.run_id }}
            Mode: prerelease
          prerelease: true
          draft: false
          make_latest: false
          overwrite_files: true
          generate_release_notes: true
          files: dist_electron/*Setup*.exe

      - name: Upload Linux prerelease
        if: steps.publish_mode.outputs.mode == 'prerelease' && runner.os == 'Linux'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_label.outputs.label }}
          name: prerelease / ${{ github.ref_name }} / ${{ github.run_number }}
          body: |
            Branch: ${{ github.ref_name }}
            Run: ${{ github.run_id }}
            Commit: ${{ steps.commit_sha.outputs.sha }}
            Workflow: ${{ github.run_id }}
            Mode: prerelease
          prerelease: true
          draft: false
          make_latest: false
          overwrite_files: true
          generate_release_notes: true
          files: dist_electron/*.AppImage

      - name: Upload Windows draft
        if: steps.publish_mode.outputs.mode == 'draft' && runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_label.outputs.label }}
          name: draft / ${{ github.ref_name }} / ${{ github.run_number }}
          body: |
            Branch: ${{ github.ref_name }}
            Run: ${{ github.run_id }}
            Commit: ${{ steps.commit_sha.outputs.sha }}
            Workflow: ${{ github.run_id }}
            Status: draft
            Mode: draft
          prerelease: false
          draft: true
          make_latest: false
          overwrite_files: true
          generate_release_notes: true
          files: dist_electron/*Setup*.exe

      - name: Upload Linux draft
        if: steps.publish_mode.outputs.mode == 'draft' && runner.os == 'Linux'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_label.outputs.label }}
          name: draft / ${{ github.ref_name }} / ${{ github.run_number }}
          body: |
            Branch: ${{ github.ref_name }}
            Run: ${{ github.run_id }}
            Commit: ${{ steps.commit_sha.outputs.sha }}
            Workflow: ${{ github.run_id }}
            Status: draft
            Mode: draft
          prerelease: false
          draft: true
          make_latest: false
          overwrite_files: true
          generate_release_notes: true
          files: dist_electron/*.AppImage

      - name: Upload Windows release
        if: steps.publish_mode.outputs.mode == 'release' && runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_label.outputs.label }}
          name: release / ${{ github.ref_name }} / ${{ github.run_number }}
          body: |
            Branch: ${{ github.ref_name }}
            Run: ${{ github.run_id }}
            Commit: ${{ steps.commit_sha.outputs.sha }}
            Workflow: ${{ github.run_id }}
            Mode: release
          prerelease: false
          draft: false
          make_latest: true
          overwrite_files: true
          generate_release_notes: true
          files: dist_electron/*Setup*.exe

      - name: Upload Linux release
        if: steps.publish_mode.outputs.mode == 'release' && runner.os == 'Linux'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_label.outputs.label }}
          name: release / ${{ github.ref_name }} / ${{ github.run_number }}
          body: |
            Branch: ${{ github.ref_name }}
            Run: ${{ github.run_id }}
            Commit: ${{ steps.commit_sha.outputs.sha }}
            Workflow: ${{ github.run_id }}
            Mode: release
          prerelease: false
          draft: false
          make_latest: true
          overwrite_files: true
          generate_release_notes: true
          files: dist_electron/*.AppImage

  cleanup-dev-prereleases:
    name: Cleanup old dev prereleases
    runs-on: ubuntu-latest
    needs: release
    if: github.ref == 'refs/heads/dev'

    steps:
      - name: Keep only last dev prereleases
        uses: actions/github-script@v7
        with:
          script: |
            const keep = Number(process.env.KEEP_RELEASES || '5');
            const { owner, repo } = context.repo;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100,
            });

            const devReleases = releases
              .filter((release) => release.prerelease)
              .filter((release) => release.tag_name?.startsWith('prerelease-dev-'))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            const stale = devReleases.slice(keep);
            core.info(`Found ${devReleases.length} dev prereleases, deleting ${stale.length} old ones.`);

            for (const release of stale) {
              core.info(`Deleting ${release.tag_name} (${release.id})`);
              await github.rest.repos.deleteRelease({
                owner,
                repo,
                release_id: release.id,
              });
            }
