name: Release

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - dev
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'UPDATE.md'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_mode:
        description: Release mode for manual runs
        required: true
        default: prerelease
        type: choice
        options:
          - draft
          - prerelease
          - release
jobs:
  build:
    name: build (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/') || github.event_name != 'push' || !contains(github.event.head_commit.message, '[release]')
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache electron-builder
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Setup build environment
        uses: ./.github/actions/setup
        with:
          install-package-deps: 'true'
          install-native-deps: 'true'
          verify-rollup: 'true'

      - name: Prepare application version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          release_tag=""
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            release_tag="${GITHUB_REF_NAME}"
          fi

          if [[ -n "$release_tag" ]]; then
            if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
              echo "Release tags must use SemVer such as v0.1.1-alpha.1: $release_tag" >&2
              exit 1
            fi
            version_input="$release_tag"
          else
            version_input="$(node -p "require('./package.json').releaseVersion || require('./package.json').version")"
          fi

          node scripts/prepare-release-version.mjs \
            "$version_input" \
            --write-package \
            --github-output

          echo "Release version: $(node -p "require('./package.json').releaseVersion")"
          echo "Internal application version: $(node -p "require('./package.json').version")"

      - name: Build Electron app
        run: yarn electron-vite build && yarn tui:build
        env:
          VUE_APP_NETEASE_API_URL: /api
          VUE_APP_ELECTRON_API_URL: /api
          VUE_APP_ELECTRON_API_URL_DEV: ${{ vars.VUE_APP_ELECTRON_API_URL_DEV || 'http://127.0.0.1:10754' }}
          VUE_APP_LASTFM_API_KEY: ${{ vars.VUE_APP_LASTFM_API_KEY }}
          VUE_APP_LASTFM_API_SHARED_SECRET: ${{ secrets.VUE_APP_LASTFM_API_SHARED_SECRET }}

      - name: Build standalone TUI
        if: runner.os == 'Windows' || runner.os == 'Linux'
        run: yarn tui:exe

      - name: Package Electron app
        if: runner.os != 'Windows'
        run: npx electron-builder --publish never
        env:
          GH_TOKEN: ${{ github.token }}
          EP_PRELEASE: ${{ steps.version.outputs.is_prerelease }}

      - name: Package Windows app
        if: runner.os == 'Windows'
        run: npx electron-builder -w --publish never
        env:
          GH_TOKEN: ${{ github.token }}
          EP_PRELEASE: ${{ steps.version.outputs.is_prerelease }}

      - name: Normalize release artifact names
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
        run: |
          set -euo pipefail
          node scripts/normalize-release-artifacts.mjs \
            dist_electron \
            "$APP_VERSION" \
            "$RELEASE_VERSION"

      - name: List dist_electron
        shell: bash
        run: |
          echo "dist_electron contents:"
          find dist_electron -maxdepth 2 -type f -print || true

      - name: Collect Linux release files
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          echo "All files in dist_electron:"
          find dist_electron -maxdepth 2 -type f -print | sort
          mkdir -p release_linux
          find dist_electron -maxdepth 1 -type f \( \
            -name "*.AppImage" -o \
            -name "*.deb" -o \
            -name "*.rpm" -o \
            -name "*.tar.gz" -o \
            -name "*.snap" -o \
            -name "*.pacman" -o \
            -name "*.blockmap" -o \
            -name "*.yml" -o \
            -name "*.yaml" -o \
            -name "*.zsync" \
          \) -print -exec cp -v {} release_linux/ \;
          echo "Collected Linux release files:"
          find release_linux -maxdepth 1 -type f -print | sort
          test "$(find release_linux -maxdepth 1 -type f | wc -l)" -gt 0

      - name: Collect Windows release files
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          echo "All files in dist_electron:"
          find dist_electron -maxdepth 2 -type f -print | sort
          mkdir -p release_windows
          find dist_electron -maxdepth 1 -type f \( \
            -name "*.exe" -o \
            -name "*.blockmap" -o \
            -name "*.yml" -o \
            -name "*.yaml" \
          \) -print -exec cp -v {} release_windows/ \;
          echo "Collected Windows release files:"
          find release_windows -maxdepth 1 -type f -print | sort
          test "$(find release_windows -maxdepth 1 -type f | wc -l)" -gt 0

      - name: Upload Windows artifact
        if: runner.os == 'Windows' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/'))
        uses: actions/upload-artifact@v4
        with:
          name: YesPlayMusic-win
          path: release_windows/*
          if-no-files-found: error

      - name: Upload Linux artifact
        if: runner.os == 'Linux' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/'))
        uses: actions/upload-artifact@v4
        with:
          name: YesPlayMusic-linux
          path: release_linux/*
          if-no-files-found: error

      - name: Upload macOS artifact
        if: runner.os == 'macOS' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/'))
        uses: actions/upload-artifact@v4
        with:
          name: YesPlayMusic-mac
          path: |
            dist_electron/*.dmg
            dist_electron/*.zip
            dist_electron/latest*.yml
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      tag: ${{ steps.tag.outputs.tag }}
      release_version: ${{ steps.version.outputs.release_version }}
      app_version: ${{ steps.version.outputs.app_version }}
      aur_pkgver: ${{ steps.version.outputs.aur_pkgver }}
      pacman_asset: ${{ steps.version.outputs.pacman_asset }}

    steps:
      - name: Check out release scripts
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: YesPlayMusic-*
          merge-multiple: true
          path: artifacts

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          release_tag=""
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            release_tag="${GITHUB_REF_NAME}"
          fi

          if [[ -n "$release_tag" ]]; then
            if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
              echo "Release tags must use SemVer such as v0.1.1-alpha.1: $release_tag" >&2
              exit 1
            fi
            version_input="$release_tag"
          else
            version_input="$(node -p "require('./package.json').releaseVersion || require('./package.json').version")"
          fi

          node scripts/prepare-release-version.mjs \
            "$version_input" \
            --github-output

      - name: Normalize and verify release artifacts
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
          EXPECTED_PACMAN_ASSET: ${{ steps.version.outputs.pacman_asset }}
        run: |
          set -euo pipefail

          node scripts/normalize-release-artifacts.mjs \
            artifacts \
            "$APP_VERSION" \
            "$RELEASE_VERSION"

          echo "release artifacts:"
          find artifacts -type f -print | sort
          test "$(find artifacts -type f | wc -l)" -gt 0

          mapfile -t pacman_files < <(
            find artifacts -maxdepth 1 -type f -name '*.pacman' -print
          )

          if [[ "${#pacman_files[@]}" -ne 1 ]]; then
            echo "Expected exactly one pacman artifact, found ${#pacman_files[@]}" >&2
            printf '%s\n' "${pacman_files[@]}"
            exit 1
          fi

          expected_path="artifacts/${EXPECTED_PACMAN_ASSET}"
          if [[ "${pacman_files[0]}" != "$expected_path" ]]; then
            echo "Unexpected Pacman asset: ${pacman_files[0]}" >&2
            echo "Expected: $expected_path" >&2
            exit 1
          fi

      - name: Decide publish mode
        id: mode
        shell: bash
        env:
          VERSION_IS_PRERELEASE: ${{ steps.version.outputs.is_prerelease }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            mode="${{ inputs.release_mode }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            if [[ "$VERSION_IS_PRERELEASE" == "true" ]]; then
              mode="prerelease"
            else
              mode="release"
            fi
          elif [[ "${GITHUB_REF}" == "refs/heads/dev" ]]; then
            mode="prerelease"
          else
            mode="artifact"
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Build release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME//\//-}"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${{ steps.mode.outputs.mode }}-${branch}-run${GITHUB_RUN_NUMBER}"
          fi

          if [[ ! "$tag" =~ ^[0-9A-Za-z._/-]+$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: steps.mode.outputs.mode != 'artifact'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: YesPlayMusic ${{ steps.version.outputs.release_version }}
          body: |
            Version: ${{ steps.version.outputs.release_version }}
            Source ref: ${{ github.ref_name }}
            Run: ${{ github.run_id }}
            Commit: ${{ github.sha }}
            Mode: ${{ steps.mode.outputs.mode }}
          prerelease: ${{ steps.mode.outputs.mode == 'prerelease' }}
          draft: ${{ steps.mode.outputs.mode == 'draft' }}
          make_latest: ${{ steps.mode.outputs.mode == 'release' }}
          overwrite_files: true
          fail_on_unmatched_files: true
          files: artifacts/*

  aur:
    name: publish AUR
    needs: publish
    if: startsWith(needs.publish.outputs.tag, 'v') && needs.publish.outputs.mode != 'draft'
    runs-on: ubuntu-latest
    environment: aur
    env:
      AUR_PACKAGE: yesplaymusic-axuanran-bin
      RELEASE_TAG: ${{ needs.publish.outputs.tag }}
      RELEASE_VERSION: ${{ needs.publish.outputs.release_version }}
      AUR_PKGVER: ${{ needs.publish.outputs.aur_pkgver }}
      PACMAN_ASSET: ${{ needs.publish.outputs.pacman_asset }}

    steps:
      - name: Check out AUR package template
        uses: actions/checkout@v4

      - name: Verify release asset exists
        shell: bash
        run: |
          set -euo pipefail
          asset_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${PACMAN_ASSET}"
          echo "Checking $asset_url"
          curl --fail --silent --show-error --location --head "$asset_url" >/dev/null

      - name: Configure AUR SSH
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<'EOF'
          Host aur.archlinux.org
            User aur
            IdentityFile ~/.ssh/aur
            IdentitiesOnly yes
          EOF
          ssh-keygen -y -f ~/.ssh/aur >/dev/null

      - name: Update AUR package
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" == "v${RELEASE_VERSION}" ]]; then
            echo "Release tag and version do not match: $RELEASE_TAG / $RELEASE_VERSION" >&2
            exit 1
          fi

          aur_dir="${RUNNER_TEMP}/aur"
          git clone "ssh://aur@aur.archlinux.org/${AUR_PACKAGE}.git" "$aur_dir"
          cd "$aur_dir"

          install -m 644 "${GITHUB_WORKSPACE}/.github/aur/PKGBUILD" PKGBUILD

          sed -Ei "s/^pkgver=.*/pkgver=${AUR_PKGVER}/" PKGBUILD
          sed -Ei "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          sed -Ei "s/^_releasever=.*/_releasever=${RELEASE_VERSION}/" PKGBUILD
          sed -Ei \
            "s#https://github.com/[^/]+/YesPlayMusic#https://github.com/${GITHUB_REPOSITORY}#g" \
            PKGBUILD
          sed -Ei \
            "s#https://raw.githubusercontent.com/[^/]+/YesPlayMusic#https://raw.githubusercontent.com/${GITHUB_REPOSITORY}#g" \
            PKGBUILD

          host_uid="$(id -u)"
          host_gid="$(id -g)"
          docker run --rm \
            -e HOST_UID="$host_uid" \
            -e HOST_GID="$host_gid" \
            -v "$PWD:/pkg" \
            archlinux:base-devel \
            bash -euc '
              pacman -Sy --noconfirm --needed pacman-contrib
              groupadd -o -g "$HOST_GID" builder
              useradd -o -m -u "$HOST_UID" -g "$HOST_GID" builder
              chown -R builder:builder /pkg
              su builder -c "cd /pkg && updpkgsums && makepkg --printsrcinfo > .SRCINFO"
            '

          git config user.name "YesPlayMusic Release Bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add PKGBUILD .SRCINFO

          if git diff --cached --quiet; then
            echo "AUR package is already up to date."
            exit 0
          fi

          git commit -m "Update to ${RELEASE_VERSION}"
          git push origin master

  gentoo:
    name: publish Gentoo overlay
    needs: publish
    if: startsWith(needs.publish.outputs.tag, 'v') && needs.publish.outputs.mode != 'draft'
    uses: ./.github/workflows/publish-gentoo.yaml
    with:
      release_version: ${{ needs.publish.outputs.release_version }}
    secrets: inherit
