name: Release

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - dev
      - master
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'UPDATE.md'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_mode:
        description: Release mode for manual runs
        required: true
        default: prerelease
        type: choice
        options:
          - draft
          - prerelease
          - release

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache electron-builder
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Setup build environment
        uses: ./.github/actions/setup
        with:
          install-package-deps: 'true'
          install-native-deps: 'true'
          verify-rollup: 'true'

      - name: Build Electron app
        run: yarn electron-vite build && yarn tui:build
        env:
          VUE_APP_NETEASE_API_URL: /api
          VUE_APP_ELECTRON_API_URL: /api
          VUE_APP_ELECTRON_API_URL_DEV: ${{ vars.VUE_APP_ELECTRON_API_URL_DEV || 'http://127.0.0.1:10754' }}
          VUE_APP_LASTFM_API_KEY: ${{ vars.VUE_APP_LASTFM_API_KEY }}
          VUE_APP_LASTFM_API_SHARED_SECRET: ${{ secrets.VUE_APP_LASTFM_API_SHARED_SECRET }}

      - name: Build standalone TUI
        if: runner.os == 'Windows' || runner.os == 'Linux'
        run: yarn tui:exe

      - name: Package Electron app
        if: runner.os != 'Windows'
        run: npx electron-builder --publish never
        env:
          GH_TOKEN: ${{ github.token }}
          EP_PRELEASE: true

      - name: Package Windows app
        if: runner.os == 'Windows'
        run: npx electron-builder -w --publish never
        env:
          GH_TOKEN: ${{ github.token }}
          EP_PRELEASE: true

      - name: List dist_electron
        shell: bash
        run: |
          echo "dist_electron contents:"
          find dist_electron -maxdepth 2 -type f -print || true

      - name: Collect Linux release files
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          echo "All files in dist_electron:"
          find dist_electron -maxdepth 2 -type f -print | sort
          mkdir -p release_linux
          find dist_electron -maxdepth 1 -type f \( \
            -name "*.AppImage" -o \
            -name "*.deb" -o \
            -name "*.rpm" -o \
            -name "*.tar.gz" -o \
            -name "*.snap" -o \
            -name "*.pacman" -o \
            -name "*.blockmap" -o \
            -name "*.yml" -o \
            -name "*.yaml" -o \
            -name "*.zsync" \
          \) -print -exec cp -v {} release_linux/ \;
          echo "Collected Linux release files:"
          find release_linux -maxdepth 1 -type f -print | sort
          test "$(find release_linux -maxdepth 1 -type f | wc -l)" -gt 0

      - name: Collect Windows release files
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          echo "All files in dist_electron:"
          find dist_electron -maxdepth 2 -type f -print | sort
          mkdir -p release_windows
          find dist_electron -maxdepth 1 -type f \( \
            -name "*.exe" -o \
            -name "*.blockmap" -o \
            -name "*.yml" -o \
            -name "*.yaml" \
          \) -print -exec cp -v {} release_windows/ \;
          echo "Collected Windows release files:"
          find release_windows -maxdepth 1 -type f -print | sort
          test "$(find release_windows -maxdepth 1 -type f | wc -l)" -gt 0

      - name: Upload Windows artifact
        if: runner.os == 'Windows' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/'))
        uses: actions/upload-artifact@v4
        with:
          name: YesPlayMusic-win
          path: release_windows/*
          if-no-files-found: error

      - name: Upload Linux artifact
        if: runner.os == 'Linux' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/'))
        uses: actions/upload-artifact@v4
        with:
          name: YesPlayMusic-linux
          path: release_linux/*
          if-no-files-found: error

      - name: Upload macOS artifact
        if: runner.os == 'macOS' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/'))
        uses: actions/upload-artifact@v4
        with:
          name: YesPlayMusic-mac
          path: |
            dist_electron/*.dmg
            dist_electron/*.zip
            dist_electron/latest*.yml
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: YesPlayMusic-*
          merge-multiple: true
          path: artifacts

      - name: List release artifacts
        shell: bash
        run: |
          echo "release artifacts:"
          find artifacts -type f -print
          test "$(find artifacts -type f | wc -l)" -gt 0

      - name: Decide publish mode
        id: mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mode="${{ inputs.release_mode }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            mode="release"
          else
            mode="artifact"
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Build release tag
        id: tag
        shell: bash
        run: |
          branch="${GITHUB_REF_NAME//\//-}"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${{ steps.mode.outputs.mode }}-${branch}-run${GITHUB_RUN_NUMBER}"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: steps.mode.outputs.mode != 'artifact'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.mode.outputs.mode }} / ${{ github.ref_name }} / ${{ github.run_number }}
          body: |
            Branch: ${{ github.ref_name }}
            Run: ${{ github.run_id }}
            Commit: ${{ github.sha }}
            Mode: ${{ steps.mode.outputs.mode }}
          prerelease: ${{ steps.mode.outputs.mode == 'prerelease' }}
          draft: ${{ steps.mode.outputs.mode == 'draft' }}
          make_latest: ${{ steps.mode.outputs.mode == 'release' }}
          files: artifacts/*
