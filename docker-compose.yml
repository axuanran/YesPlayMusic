services:
  xump:
    image: ${XUMP_IMAGE:-ghcr.io/axuanran/xump:latest}
    container_name: xump
    volumes:
      - xump-data:/data
    ports:
      - "80:80"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/api/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      NODE_ENV: production
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      TZ: Asia/Shanghai
      VUE_APP_NETEASE_API_URL: /api
      YPM_RESOLVER_STORAGE_DIR: /data/resolver-storage
      NETEASE_API_PORT: "10754"
    networks:
      my_network:

volumes:
  xump-data:

networks:
  my_network:
    driver: bridge
