services:
  xump:
    image: ${XUMP_IMAGE:-ghcr.io/axuanran/xump:latest}
    container_name: xump
    volumes:
      - xump-data:/data
    ports:
      - "80:80"
    restart: always
    depends_on:
      - unblock-netease-music
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/api/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      NODE_ENV: production
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      TZ: Asia/Shanghai
      VUE_APP_NETEASE_API_URL: /api
      YPM_RESOLVER_STORAGE_DIR: /data/resolver-storage
      NETEASE_API_PORT: "10754"
    networks:
      my_network:

  unblock-netease-music:
    image: pan93412/unblock-netease-music-enhanced
    command: -o kugou kuwo migu bilibili pyncmd -p 80:443 -f ${UNBLOCK_FORCE_HOST:-45.127.129.53} -e -
    # environment:
    #   JSON_LOG: true
    #   LOG_LEVEL: debug
    networks:
      my_network:
        aliases:
          - music.163.com
          - interface.music.163.com
          - interface3.music.163.com
          - interface.music.163.com.163jiasu.com
          - interface3.music.163.com.163jiasu.com
    restart: always

volumes:
  xump-data:

networks:
  my_network:
    driver: bridge
